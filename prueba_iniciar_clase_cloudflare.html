<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba iniciar clase</title><style>body{font:16px Arial;background:#f4f6fa;color:#0b274e;padding:25px}main{max-width:550px;margin:auto;background:white;padding:25px;border-radius:12px}h1{color:#831628}input{display:block;width:95%;padding:12px;margin:8px 0 16px}button{background:#075ed4;color:white;border:0;padding:12px;border-radius:7px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;background:#eef3f9;padding:12px}</style><main><h1>Universidad de Pamplona</h1><h2>Prueba de inicio de clase</h2><p>La prueba creará una sesión activa de <b>PROGRAMACION I · Grupo A</b>, sin registrar asistencias. Será necesario cerrarla después.</p><section id="login"><label>Correo docente<input id="email" type="email"></label><label>Contraseña<input id="password" type="password"></label><button id="enter">Ingresar</button></section><section id="panel" hidden><p>Acceso correcto. Todavía no se ha iniciado ninguna clase.</p><button id="start">Iniciar clase de prueba</button></section><p id="status"></p><pre id="result" hidden></pre></main><script>
const API='https://asistencia-unipamplona-api.jcseba2010.workers.dev';let token='';const $=id=>document.getElementById(id);function show(message,data){$('status').textContent=message;$('result').hidden=!data;if(data)$('result').textContent=JSON.stringify(data,null,2)}async function api(path,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(token)headers.Authorization='Bearer '+token;const response=await fetch(API+path,{...options,headers});const data=await response.json();if(!response.ok||data.ok===false)throw Error(data.mensaje||'Error HTTP '+response.status);return data}
$('enter').onclick=async()=>{$('enter').disabled=true;show('Verificando acceso…');try{const result=await api('/api/docente/login',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});if(!result.token)throw Error('No se recibió token');token=result.token;await api('/api/docente/verificar');$('password').value='';$('login').hidden=true;$('panel').hidden=false;show('Acceso correcto. Pulse el botón de prueba cuando esté listo.')}catch(e){token='';show('Error: '+e.message)}finally{$('enter').disabled=false}};
$('start').onclick=async()=>{if(!confirm('¿Crear UNA sesión de prueba de PROGRAMACION I, grupo A?'))return;$('start').disabled=true;show('Iniciando clase de prueba…');try{const result=await api('/api/docente/iniciar-clase',{method:'POST',body:JSON.stringify({asignatura:'PROGRAMACION I',grupo:'A'})});show('Sesión creada. Envíeme el ID para cerrarla.',{ok:result.ok,sesion_id:result.sesion_id,asignatura:result.asignatura,grupo:result.grupo,mensaje:result.mensaje})}catch(e){show('Error: '+e.message);$('start').disabled=false}};
</script></html>
