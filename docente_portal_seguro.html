<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingreso Docente · Universidad de Pamplona</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#1b0d0d;color:#fff}
.hero{min-height:100vh;background:url('leon.png') center center/cover no-repeat;position:relative;display:flex;align-items:flex-end;justify-content:center;padding:24px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(35,0,0,.48),rgba(35,0,0,.04) 46%,rgba(35,0,0,.12))}
.access{position:relative;z-index:2;margin-bottom:4vh;background:rgba(122,18,25,.94);border:2px solid #e4bd54;border-radius:16px;box-shadow:0 12px 34px #0008;padding:18px 24px;text-align:center;max-width:560px;width:min(92vw,560px)}
.access h1{margin:0 0 6px;font-family:Georgia,serif;font-size:30px}.access p{margin:0 0 14px;font-size:14px;line-height:1.45}.btn{display:inline-block;text-decoration:none;background:#fff;color:#8f2529;font-weight:900;padding:13px 24px;border-radius:9px;border:2px solid #fff;font-size:16px}.btn:hover{background:#f7e8e8}.mini{font-size:11px;opacity:.9;margin-top:10px}
@media(max-width:700px){.hero{background-position:center top;padding:14px;align-items:flex-end}.access{padding:14px 16px;margin-bottom:2vh}.access h1{font-size:24px}}
</style>
</head>
<body>
<main class="hero">
  <section class="access" aria-label="Acceso seguro al panel docente">
    <h1>Ingreso Docente</h1>
    <p>Universidad de Pamplona · Sistema de Asistencia y Evaluación</p>
    <a class="btn" href="docente_pestanas.html">INGRESAR AL PANEL DOCENTE</a>
    <div class="mini">El acceso real y la validación de la cuenta se realizan en el sistema institucional.</div>
  </section>
</main>
</body>
</html>
