<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba de acceso · Universidad de Pamplona</title><style>body{font-family:system-ui,Arial,sans-serif;background:#f2f5f9;color:#183153;display:grid;place-items:center;min-height:100vh;margin:0}main{background:white;border-radius:16px;padding:28px;width:min(420px,90vw);box-shadow:0 10px 35px #1232}h1{font-size:1.35rem}label{display:block;margin-top:16px;font-weight:600}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border-radius:8px;border:1px solid #a8b7ca;font-size:1rem}button{background:#163b72;color:white;font-weight:700;cursor:pointer;margin-top:20px}button:disabled{opacity:.65}#status{margin-top:16px;white-space:pre-wrap}small{color:#52667e}</style></head><body><main><h1>Universidad de Pamplona</h1><p>Prueba de acceso del docente con Cloudflare D1</p><form id="f"><label>Correo<input type="email" id="email" value="jcseba2010@gmail.com" autocomplete="username" required></label><label>Contraseña<input type="password" id="pass" autocomplete="current-password" required></label><button id="btn">Comprobar acceso</button></form><div id="status" role="status" aria-live="polite"></div><p><small>Esta página es una prueba aislada. No modifica asistencias, estudiantes ni exámenes. No reemplaza todavía el panel docente.</small></p></main><script>
const BASE='https://asistencia-unipamplona-api.jcseba2010.workers.dev';
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('btn'),status=document.getElementById('status'),pass=document.getElementById('pass');btn.disabled=true;status.textContent='Verificando acceso…';try{const r=await fetch(BASE+'/api/docente/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:pass.value}),cache:'no-store'});const data=await r.json();if(!r.ok||!data.ok||!data.token)throw new Error(data.mensaje||data.error||'No fue posible iniciar sesión');const verify=await fetch(BASE+'/api/docente/verificar',{headers:{Authorization:'Bearer '+data.token},cache:'no-store'});const verified=await verify.json();if(!verify.ok||!verified.ok)throw new Error('El inicio de sesión funcionó, pero falló la verificación de sesión.');status.textContent='✓ Acceso y sesión verificados correctamente.\nDocente: '+(data.docente?.nombre||data.docente?.display_name||document.getElementById('email').value.trim());}catch(err){status.textContent='No se pudo verificar: '+err.message+'\nSi abrió este archivo directamente, puede ser necesario probarlo desde GitHub Pages debido a la política CORS.';}finally{pass.value='';btn.disabled=false;}});
</script></body></html>
